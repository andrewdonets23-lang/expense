<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Рублик</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0c0d10;--s1:#17181d;--s2:#22242b;--tx:#f2f3f5;--mu:#8b8f99;--lime:#c8ff2e;--ink:#0c0d10;--bad:#ff5a6a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
section{display:none}section.on{display:block;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
h2{font-size:22px;margin:8px 0 14px;letter-spacing:-.5px}
h3{font-size:16px;margin:22px 0 10px;color:var(--mu);font-weight:600}
.err{background:var(--bad);color:#fff;padding:10px;border-radius:10px;margin-bottom:10px;font-size:13px}
.ring{position:relative;width:190px;height:190px;margin:4px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--s2);stroke-width:9}
.arc{fill:none;stroke:var(--lime);stroke-width:9;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset .6s,stroke .3s}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px}
.mid b{font-size:34px;letter-spacing:-1px;line-height:1.1}
.mid small{color:var(--mu);font-size:12px}
.pill{width:max-content;margin:6px auto 12px;background:var(--s1);color:var(--lime);padding:6px 14px;border-radius:20px;font-size:14px;font-weight:600}
.amt{text-align:center;font-size:52px;font-weight:800;letter-spacing:-2px;margin-bottom:8px}
.amt i{font-style:normal;color:var(--lime);font-size:32px;margin-left:6px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.cat{background:var(--s1);color:var(--tx);border:0;border-radius:14px;padding:10px 2px;font:inherit;font-size:11px;cursor:pointer;transition:transform .1s}
.cat span{display:block;font-size:24px}
.cat:active{transform:scale(.94)}
.cat.on{background:var(--lime);color:var(--ink);font-weight:700}
.seg{display:flex;gap:8px;margin-bottom:10px}
.chip{background:var(--s1);color:var(--tx);border:0;border-radius:20px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--lime);color:var(--ink);font-weight:700}
input[type=text],input:not([type]){flex:1;min-width:0;width:100%;background:var(--s1);color:var(--tx);border:2px solid transparent;border-radius:12px;padding:10px 14px;font:inherit}
input:focus{outline:none;border-color:var(--lime)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.k{background:var(--s1);color:var(--tx);border:0;border-radius:14px;padding:14px 0;font:inherit;font-size:22px;font-weight:600;cursor:pointer}
.k:active{background:var(--s2)}
.save{width:100%;background:var(--lime);color:var(--ink);border:0;border-radius:16px;padding:16px;font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.save:active{transform:scale(.98)}
.scroll{display:flex;gap:8px;overflow-x:auto;margin-bottom:6px;padding-bottom:4px}
.day{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;margin:16px 0 4px}
.row{display:flex;align-items:center;gap:12px;background:var(--s1);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.row .ic{font-size:24px}
.row .m{flex:1;min-width:0}.row .m b{display:block;font-weight:600}
.row .m span{color:var(--mu);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-weight:700;white-space:nowrap}
.del{background:none;border:0;color:var(--mu);font-size:18px;padding:4px 6px;cursor:pointer}
.card{background:var(--s1);border-radius:16px;padding:14px;margin-bottom:10px}
.tip{background:var(--s1);border-radius:14px;padding:12px 14px;margin-bottom:8px;color:var(--mu);font-size:15px}
.tip b{display:block;color:var(--tx);margin-bottom:2px}
.tip #wp{color:var(--lime);font-weight:700}
input[type=range]{width:100%;accent-color:var(--lime);margin:10px 0;padding:0;background:none}
.bar{height:12px;background:var(--s2);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--lime);border-radius:8px;transition:width .5s}
label{display:block;color:var(--mu);font-size:13px;margin:12px 0 4px}
.empty{color:var(--mu);text-align:center;padding:30px 10px}
canvas{max-height:250px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--s1);padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--s2)}
.tab{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;padding:6px 0;border-radius:12px;cursor:pointer}
.tab span{display:block;font-size:22px}
.tab.on{color:var(--lime);font-weight:700}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--lime);color:var(--ink);font-weight:700;padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translateX(-50%)}
button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
</style></head>
<body>

<section id="v-add" class="on">
  <div class="ring">
    <svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="54"/><circle class="arc" id="arc" cx="60" cy="60" r="54"/></svg>
    <div class="mid"><small id="rl"></small><b id="rn">0</b><small id="rs"></small></div>
  </div>
  <div class="pill" id="streak"></div>
  <div class="amt"><span id="amt">0</span><i id="cA">₽</i></div>
  <div class="cats" id="cats"></div>
  <div class="seg">
    <button class="chip on" data-d="0">Сегодня</button>
    <button class="chip" data-d="1">Вчера</button>
    <input id="note" maxlength="40" placeholder="Заметка">
  </div>
  <div class="pad" id="pad"></div>
  <button class="save" id="save">Добавить расход</button>
</section>

<section id="v-list">
  <h2>История</h2>
  <div class="scroll" id="hf"></div>
  <div id="list"></div>
</section>

<section id="v-stats">
  <h2>Куда уходят деньги</h2>
  <div class="seg" id="per">
    <button class="chip on" data-p="week">Неделя</button>
    <button class="chip" data-p="month">Месяц</button>
  </div>
  <div class="card"><canvas id="pie"></canvas></div>
  <h3>Последние 7 дней</h3>
  <div class="card"><canvas id="bars"></canvas></div>
  <h3>Выводы</h3>
  <div id="ins"></div>
</section>

<section id="v-goal">
  <h2>Цели</h2>
  <label for="limit">Лимит на неделю</label>
  <input id="limit" inputmode="decimal" placeholder="Например, 1500">
  <label for="gn">На что копишь</label>
  <input id="gn" maxlength="30" placeholder="Например, наушники">
  <label for="gs">Сколько нужно</label>
  <input id="gs" inputmode="decimal" placeholder="Например, 8000">
  <label for="cur">Валюта</label>
  <input id="cur" maxlength="4" placeholder="₽">
  <div style="height:14px"></div>
  <button class="save" id="saveS">Сохранить</button>
  <h3>Накопления</h3>
  <div class="card" id="gc"></div>
  <div class="seg">
    <input id="dep" inputmode="decimal" placeholder="Сколько отложил">
    <button class="chip on" id="depB">Отложить</button>
  </div>
</section>

<nav class="tabs">
  <button class="tab on" data-v="add"><span>➕</span>Трата</button>
  <button class="tab" data-v="list"><span>🧾</span>История</button>
  <button class="tab" data-v="stats"><span>📊</span>Анализ</button>
  <button class="tab" data-v="goal"><span>🎯</span>Цели</button>
</nav>
<div id="toast"></div>

<script>
const tg=window.Telegram&&window.Telegram.WebApp;
try{if(tg){tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor('#0c0d10');tg.setBackgroundColor&&tg.setBackgroundColor('#0c0d10')}}catch(e){}
window.onerror=m=>{document.body.insertAdjacentHTML('afterbegin','<div class="err">Ошибка: '+m+'</div>')};
const $=id=>document.getElementById(id);
const CATS=[
{id:'food',n:'Еда',i:'🍔',c:'#ff9f43'},{id:'trans',n:'Проезд',i:'🚌',c:'#4d8dff'},
{id:'games',n:'Игры',i:'🎮',c:'#a66bff'},{id:'clothes',n:'Одежда',i:'👕',c:'#ff6bb0'},
{id:'subs',n:'Подписки',i:'📱',c:'#2fd0e0'},{id:'fun',n:'Отдых',i:'🎬',c:'#ffd23f'},
{id:'study',n:'Учёба',i:'📚',c:'#3ddc84'},{id:'other',n:'Другое',i:'📦',c:'#8b8f99'}];
const cat=id=>CATS.find(c=>c.id===id)||CATS[7];
if(window.Chart){Chart.defaults.color='#8b8f99';Chart.defaults.borderColor='rgba(255,255,255,.07)'}

/* ---- хранение: облако Telegram + копия в браузере ---- */
const cs=tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9')?tg.CloudStorage:null;
const local=()=>{const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^ex:|^settings$/.test(k))o[k]=localStorage.getItem(k)}return o};
const cloud=()=>new Promise(r=>{
  if(!cs)return r({});
  const t=setTimeout(()=>r({}),2500);
  try{cs.getKeys((e,k)=>{
    if(e||!k||!k.length){clearTimeout(t);return r({})}
    cs.getItems(k,(e2,v)=>{clearTimeout(t);r(e2?{}:v)})
  })}catch(x){clearTimeout(t);r({})}
});
const put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}try{cs&&cs.setItem(k,v)}catch(e){}};

/* ---- данные ---- */
let E=[],S={limit:0,goalName:'',goalSum:0,saved:0,cur:'₽'};
let sel='food',dsel=0,amt='',per='week',hf='all',ch1,ch2,WI={};
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymd(d)};
const num=s=>{const v=parseFloat(String(s).replace(',','.').replace(/\s/g,''));return isFinite(v)&&v>0?v:0};
const fmt=n=>Math.round(n).toLocaleString('ru-RU')+' '+S.cur;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wk=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x};
const sum=(a,b)=>E.filter(e=>e.d>=a&&e.d<=b).reduce((s,e)=>s+e.a,0);
const dlabel=d=>d===ago(0)?'Сегодня':d===ago(1)?'Вчера':d.split('-').reverse().slice(0,2).join('.');
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1500)}
function buzz(){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred('light')}catch(e){}}

function saveMonth(m){
  let arr=E.filter(e=>e.d.startsWith(m)),j=JSON.stringify(arr);
  while(j.length>3900){arr.pop();j=JSON.stringify(arr)}
  put('ex:'+m,j);
}
const saveS=()=>put('settings',JSON.stringify(S));

async function load(){
  let all=await cloud();
  if(!Object.keys(all).length)all=local();
  const seen={};E=[];
  Object.keys(all).forEach(k=>{try{
    if(k.startsWith('ex:'))JSON.parse(all[k]).forEach(e=>{if(!seen[e.id]){seen[e.id]=1;E.push(e)}});
    if(k==='settings')Object.assign(S,JSON.parse(all[k]));
  }catch(e){}});
  E.sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
}

/* ---- экраны ---- */
function show(v){
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  if(v==='add')home();if(v==='list')hist();if(v==='stats')stats();if(v==='goal')goals();
  window.scrollTo(0,0);buzz();
}

function home(){
  const spent=sum(ymd(wk(new Date())),'9999-12-31'),L=S.limit,arc=$('arc');
  const p=L>0?Math.min(1,spent/L):0;
  arc.style.strokeDashoffset=339.3*(1-p);
  arc.style.stroke=L>0&&spent>L?'var(--bad)':'var(--lime)';
  if(L>0){
    const left=L-spent;
    $('rl').textContent=left>=0?'осталось на неделю':'перебор за неделю';
    $('rn').textContent=fmt(Math.abs(left));
    $('rs').textContent='лимит '+fmt(L);
  }else{
    $('rl').textContent='потрачено за неделю';
    $('rn').textContent=fmt(spent);
    $('rs').textContent='задай лимит в «Цели»';
  }
  const set=new Set(E.map(e=>e.d));let d=new Date(),n=0;
  if(!set.has(ymd(d)))d.setDate(d.getDate()-1);
  while(set.has(ymd(d))){n++;d.setDate(d.getDate()-1)}
  $('streak').textContent=n?'🔥 '+n+' дн. подряд':'Запиши трату и начни серию 🔥';
  $('cA').textContent=S.cur;
}

function press(k){
  buzz();
  if(k==='⌫')amt=amt.slice(0,-1);
  else if(k===','){if(!amt)amt='0,';else if(!amt.includes(','))amt+=','}
  else if(amt.length<8&&!(amt==='0'&&k==='0')){amt=(amt==='0'?'':amt)+k}
  $('amt').textContent=amt||'0';
}

function add(){
  const a=num(amt);
  if(!a){toast('Введи сумму');return}
  const d=ago(dsel);
  E.unshift({id:Date.now(),a,c:sel,d,n:$('note').value.trim()});
  E.sort((x,y)=>y.d.localeCompare(x.d)||y.id-x.id);
  saveMonth(d.slice(0,7));
  amt='';$('amt').textContent='0';$('note').value='';
  home();toast('Добавлено ✓');
  try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success')}catch(e){}
}

function hist(){
  const used=[...new Set(E.map(e=>e.c))];
  if(hf!=='all'&&!used.includes(hf))hf='all';
  $('hf').innerHTML=['all',...used].map(c=>`<button class="chip ${c===hf?'on':''}" data-c="${c}">${c==='all'?'Все':cat(c).i+' '+cat(c).n}</button>`).join('');
  document.querySelectorAll('#hf .chip').forEach(b=>b.onclick=()=>{hf=b.dataset.c;hist()});
  const list=E.filter(e=>hf==='all'||e.c===hf).slice(0,150);
  if(!list.length){$('list').innerHTML='<div class="empty">Пока пусто. Добавь первую трату 👆</div>';return}
  let h='',cur='';
  list.forEach(e=>{
    if(e.d!==cur){cur=e.d;const t=list.filter(x=>x.d===cur).reduce((s,x)=>s+x.a,0);h+=`<div class="day"><span>${dlabel(cur)}</span><span>${fmt(t)}</span></div>`}
    const c=cat(e.c);
    h+=`<div class="row"><div class="ic">${c.i}</div><div class="m"><b>${c.n}</b>${e.n?`<span>${esc(e.n)}</span>`:''}</div><div class="s">−${fmt(e.a)}</div><button class="del" data-id="${e.id}" aria-label="Удалить">✕</button></div>`;
  });
  $('list').innerHTML=h;
  document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    const del=()=>{const e=E.find(x=>x.id==b.dataset.id);E=E.filter(x=>x.id!=b.dataset.id);if(e)saveMonth(e.d.slice(0,7));hist()};
    try{tg.showConfirm('Удалить трату?',ok=>ok&&del())}catch(x){confirm('Удалить трату?')&&del()}
  });
}

function stats(){
  const now=new Date();
  const from=per==='week'?ymd(wk(now)):ymd(new Date(now.getFullYear(),now.getMonth(),1));
  const list=E.filter(e=>e.d>=from),total=list.reduce((s,e)=>s+e.a,0),by={};
  list.forEach(e=>by[e.c]=(by[e.c]||0)+e.a);
  const ids=Object.keys(by).sort((a,b)=>by[b]-by[a]);
  if(window.Chart){
    ch1&&ch1.destroy();
    ch1=new Chart($('pie'),{type:'doughnut',data:{labels:ids.map(i=>cat(i).i+' '+cat(i).n),datasets:[{data:ids.map(i=>by[i]),backgroundColor:ids.map(i=>cat(i).c),borderWidth:0}]},options:{cutout:'64%',plugins:{legend:{position:'bottom',labels:{color:'#f2f3f5'}}}}});
    const days=[],vals=[];
    for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toLocaleDateString('ru-RU',{weekday:'short'}));vals.push(sum(ymd(d),ymd(d)))}
    ch2&&ch2.destroy();
    ch2=new Chart($('bars'),{type:'bar',data:{labels:days,datasets:[{data:vals,backgroundColor:'#c8ff2e',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true}}}});
  }
  insights(total,by,ids);
}

function insights(total,by,ids){
  if(!ids.length){$('ins').innerHTML='<div class="empty">Добавь несколько трат, и здесь появятся выводы.</div>';return}
  const out=[],now=new Date(),ws=wk(now),pws=new Date(ws);pws.setDate(pws.getDate()-7);
  const pwe=new Date(ws);pwe.setDate(pwe.getDate()-1);
  const thisW=sum(ymd(ws),'9999-12-31'),lastW=sum(ymd(pws),ymd(pwe));
  const tip=(t,x)=>out.push(`<div class="tip"><b>${t}</b>${x}</div>`);
  const top=ids[0],share=Math.round(by[top]/total*100);
  tip(`${cat(top).i} Больше всего уходит на «${cat(top).n}»`,`${fmt(by[top])}, это ${share}% трат за период.`);
  if(lastW>0){const df=Math.round((thisW-lastW)/lastW*100);tip(df>0?'📈 Эта неделя дороже прошлой':'📉 Эта неделя дешевле прошлой',`Сейчас ${fmt(thisW)}, на прошлой было ${fmt(lastW)} (${df>0?'+':''}${df}%).`)}
  const dn=Math.max(1,Math.floor((now-ws)/864e5)+1),avg=thisW/dn;
  tip('📅 В среднем за день',`${fmt(avg)} на этой неделе.`);
  if(S.limit>0)tip(avg*7>S.limit?'⚠️ Лимит может не хватить':'✅ С лимитом всё в порядке',`К концу недели выйдет примерно ${fmt(avg*7)} при лимите ${fmt(S.limit)}.`);
  if(share>=15){
    WI={m:per==='week'?by[top]*4.33:by[top]};
    out.push(`<div class="tip"><b>🧪 А что если…</b>Тратить на «${cat(top).n}» меньше на <span id="wp">20%</span><input type="range" id="sl" min="0" max="60" value="20"><div id="wr"></div></div>`);
  }
  $('ins').innerHTML=out.join('');
  if($('sl')){
    const up=()=>{
      const p=+$('sl').value,sv=WI.m*p/100;$('wp').textContent=p+'%';
      let t=`Это ${fmt(sv)} в месяц.`;
      if(S.goalSum>S.saved&&sv>0)t+=` До цели «${esc(S.goalName||'цель')}» останется примерно ${Math.ceil((S.goalSum-S.saved)/(sv/4.33))} нед.`;
      $('wr').innerHTML=t;
    };
    $('sl').oninput=up;up();
  }
}

function goals(){
  $('limit').value=S.limit||'';$('gn').value=S.goalName;$('gs').value=S.goalSum||'';$('cur').value=S.cur;
  if(S.goalSum>0){
    const p=Math.min(100,S.saved/S.goalSum*100);
    let h=`<b>${esc(S.goalName||'Моя цель')}</b><div>${fmt(S.saved)} из ${fmt(S.goalSum)} (${Math.round(p)}%)</div><div class="bar"><i style="width:${p}%"></i></div>`;
    const ws=wk(new Date()),pws=new Date(ws);pws.setDate(pws.getDate()-7);
    const pwe=new Date(ws);pwe.setDate(pwe.getDate()-1);
    const free=S.limit-sum(ymd(pws),ymd(pwe));
    if(S.limit>0&&free>0&&S.saved<S.goalSum)h+=`<div style="color:var(--mu);font-size:14px">Если откладывать остаток лимита, как на прошлой неделе (${fmt(free)}), накопишь примерно за ${Math.ceil((S.goalSum-S.saved)/free)} нед.</div>`;
    if(S.saved>=S.goalSum)h+='<div style="color:var(--lime);font-weight:700">🎉 Цель достигнута!</div>';
    $('gc').innerHTML=h;
  }else $('gc').innerHTML='<span style="color:var(--mu)">Укажи, сколько нужно накопить, и здесь появится прогресс.</span>';
}

/* ---- запуск ---- */
function init(){
  $('cats').innerHTML=CATS.map(c=>`<button class="cat ${c.id===sel?'on':''}" data-c="${c.id}"><span>${c.i}</span>${c.n}</button>`).join('');
  document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{sel=b.dataset.c;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x===b));buzz()});
  $('pad').innerHTML=['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(k=>`<button class="k" data-k="${k}">${k}</button>`).join('');
  document.querySelectorAll('.k').forEach(b=>b.onclick=()=>press(b.dataset.k));
  document.querySelectorAll('.seg [data-d]').forEach(b=>b.onclick=()=>{dsel=+b.dataset.d;document.querySelectorAll('.seg [data-d]').forEach(x=>x.classList.toggle('on',x===b))});
  document.querySelectorAll('#per .chip').forEach(b=>b.onclick=()=>{per=b.dataset.p;document.querySelectorAll('#per .chip').forEach(x=>x.classList.toggle('on',x===b));stats()});
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.v));
  $('save').onclick=add;
  $('saveS').onclick=()=>{
    S.limit=num($('limit').value);S.goalName=$('gn').value.trim();S.goalSum=num($('gs').value);S.cur=$('cur').value.trim()||'₽';
    saveS();goals();toast('Сохранено ✓');
  };
  $('depB').onclick=()=>{const v=num($('dep').value);if(!v)return;S.saved+=v;$('dep').value='';saveS();goals();toast('Отложено ✓')};
  home();
}
init();
load().then(home).catch(e=>console.error(e));
</script>
</body></html>
